<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turing Test — ConSynth-X</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">ConSynth<span class="highlight">-X</span> Validation</a>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container" id="task-area" data-task="turing">
    <div class="progress-bar-container">
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>

    <div class="task-image-container">
      <img id="task-image" src="" alt="Evaluate this image">
    </div>

    <h3 style="text-align:center;margin-bottom:0.5rem">Is this image Real or Synthetic?</h3>

    <div class="response-buttons">
      <button class="response-btn" onclick="submitTuring('real')">
        Real Photo
        <span class="key-hint">Press <kbd>R</kbd></span>
      </button>
      <button class="response-btn" onclick="submitTuring('synthetic')">
        AI-Generated
        <span class="key-hint">Press <kbd>S</kbd></span>
      </button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>loadTuring();</script>
  <footer class="site-footer">
    <strong>ConSynth-X</strong> — Synthetic Construction Image Benchmark<br>
    Viet Huy Duong &amp; Ruoxin Xiong<br>
    Kent State University
  </footer>
</body>
</html>
