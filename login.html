<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ConSynth-X Validation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <h1>ConSynth<span class="highlight">-X</span></h1>
      <p class="subtitle">Human Perceptual Validation Platform</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="email">Email (optional)</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Start Evaluation</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <footer class="site-footer">
    <strong>ConSynth-X</strong> — Synthetic Construction Image Benchmark<br>
    Viet Huy Duong &amp; Ruoxin Xiong<br>
    Kent State University
  </footer>
</body>
</html>
