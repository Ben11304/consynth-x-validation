<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ConSynth-X Validation</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <h1>ConSynth<span class="highlight">-X</span></h1>
      <p class="subtitle">Human Perceptual Validation Platform</p>

      <div id="login-alert" class="flash flash-error" style="display:none"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Choose a unique name" oninput="onUsernameChange()">
          <small id="username-hint" style="font-family:var(--font-mono);font-size:0.7rem;color:var(--text-muted);margin-top:0.3rem;display:block">
            Each evaluator must use a new, unique name. Usernames cannot be reused.
          </small>
        </div>
        <div class="form-group" id="password-group" style="display:none">
          <label for="password">Admin password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="Required for admin">
        </div>
        <div class="form-group" id="email-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
        <div class="form-group" id="email-private-group" style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem">
          <input type="checkbox" id="email-private" style="width:auto;accent-color:var(--accent-orange)">
          <label for="email-private" style="text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--text-secondary);margin:0">
            Keep my email private (will not appear in published data)
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="margin-top:1.25rem">Start Evaluation</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

  <footer class="site-footer">
    <strong>ConSynth-X</strong> — Synthetic Construction Image Benchmark<br>
    Viet Huy Duong &amp; Ruoxin Xiong<br>
    Kent State University
  </footer>
</body>
</html>
