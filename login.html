<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ConSynth-X Validation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <h1>ConSynth-X</h1>
      <p class="subtitle">Human Perceptual Validation Platform</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label for="email">Email (optional)</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Start Evaluation</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
