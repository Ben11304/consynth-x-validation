<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realism Rating — ConSynth-X</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">ConSynth<span class="highlight">-X</span> Validation</a>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container" id="task-area" data-task="realism">
    <div class="progress-bar-container">
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>

    <div class="task-image-container">
      <img id="task-image" src="" alt="Rate this image">
    </div>

    <h3 style="text-align:center;margin-bottom:0.5rem">How realistic is this image?</h3>

    <div class="likert-scale">
      <label class="likert-option">
        <input type="radio" name="score" value="1" onchange="selectScore()">
        <div class="likert-circle">1</div>
        <span class="likert-label">Very Unrealistic</span>
      </label>
      <label class="likert-option">
        <input type="radio" name="score" value="2" onchange="selectScore()">
        <div class="likert-circle">2</div>
        <span class="likert-label">Unrealistic</span>
      </label>
      <label class="likert-option">
        <input type="radio" name="score" value="3" onchange="selectScore()">
        <div class="likert-circle">3</div>
        <span class="likert-label">Neutral</span>
      </label>
      <label class="likert-option">
        <input type="radio" name="score" value="4" onchange="selectScore()">
        <div class="likert-circle">4</div>
        <span class="likert-label">Realistic</span>
      </label>
      <label class="likert-option">
        <input type="radio" name="score" value="5" onchange="selectScore()">
        <div class="likert-circle">5</div>
        <span class="likert-label">Indistinguishable</span>
      </label>
    </div>

    <div style="text-align:center">
      <button class="btn btn-primary btn-lg" id="submit-realism" disabled onclick="submitRealism()">Submit</button>
    </div>
    <p class="shortcut-hint">Keyboard: <kbd>1</kbd>-<kbd>5</kbd> to select, <kbd>Enter</kbd> to submit</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>loadRealism();</script>
  <footer class="site-footer">
    <strong>ConSynth-X</strong> — Synthetic Construction Image Benchmark<br>
    Viet Huy Duong &amp; Ruoxin Xiong<br>
    Kent State University
  </footer>
</body>
</html>
