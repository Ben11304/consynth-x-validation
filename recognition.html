<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condition Recognition — ConSynth-X</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">ConSynth<span class="highlight">-X</span> Validation</a>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </nav>

  <div class="container" id="task-area" data-task="recognition">
    <div class="progress-bar-container">
      <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
      <span class="progress-text" id="progress-text">0 / 0</span>
    </div>

    <div class="task-image-container">
      <img id="task-image" src="" alt="Identify condition">
    </div>

    <h3 style="text-align:center;margin-bottom:0.5rem">What condition is shown?</h3>

    <div class="condition-grid">
      <div class="condition-option" onclick="selectCondition(this,'clear')">Clear / Original</div>
      <div class="condition-option" onclick="selectCondition(this,'rain')">Rain</div>
      <div class="condition-option" onclick="selectCondition(this,'snow')">Snow</div>
      <div class="condition-option" onclick="selectCondition(this,'snow_light')">Snow — Light</div>
      <div class="condition-option" onclick="selectCondition(this,'snow_heavy')">Snow — Heavy</div>
      <div class="condition-option" onclick="selectCondition(this,'night')">Night</div>
      <div class="condition-option" onclick="selectCondition(this,'fog')">Fog</div>
      <div class="condition-option" onclick="selectCondition(this,'fog_medium')">Fog — Medium</div>
      <div class="condition-option" onclick="selectCondition(this,'fog_heavy')">Fog — Heavy</div>
      <div class="condition-option" onclick="selectCondition(this,'small')">Small / Far objects</div>
    </div>

    <div style="text-align:center">
      <button class="btn btn-primary btn-lg" id="submit-recognition" disabled onclick="submitRecognition()">Submit</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>loadRecognition();</script>
  <footer class="site-footer">
    <strong>ConSynth-X</strong> — Synthetic Construction Image Benchmark<br>
    Viet Huy Duong &amp; Ruoxin Xiong<br>
    Kent State University
  </footer>
</body>
</html>
